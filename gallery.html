<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Party Gallery - Harshini's 9th Birthday</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    .gallery-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .gallery-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: var(--color-accent);
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.3s;
    }

    .back-link:hover {
      transform: translateX(-5px);
      color: var(--color-primary);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .grid-item {
      border-radius: 16px;
      overflow: hidden;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      transition: transform 0.3s ease, border-color 0.3s ease;
      aspect-ratio: 9/16;
      position: relative;
    }

    .grid-item:hover {
      transform: translateY(-5px);
      border-color: var(--color-primary);
    }

    .grid-item img, .grid-item iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border: none;
      cursor: pointer;
    }

    .video-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--color-accent);
      text-align: center;
      padding: 20px;
      background: rgba(0, 245, 212, 0.05);
    }

    .video-placeholder span {
      font-size: 2rem;
      margin-bottom: 10px;
    }

    @media (max-width: 600px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="background-animation"></div>
  <div class="confetti-container" id="confetti"></div>

  <div class="gallery-container">
    <a href="/" class="back-link">← Back to Home</a>
    
    <header class="gallery-header glass-panel">
      <div class="shine-effect"></div>
      <h1>Party Highlights ✨</h1>
      <p>Thank you for making this day so magical!</p>
    </header>

    <div class="grid" id="galleryGrid">
      <!-- Images -->
      <div class="grid-item"><img src="/gallery/IMG_3457.jpg" loading="lazy" alt="Party Photo"></div>
      <div class="grid-item"><img src="/gallery/IMG_3453.jpg" loading="lazy" alt="Party Photo"></div>
      <div class="grid-item"><img src="/gallery/IMG_3456.jpg" loading="lazy" alt="Party Photo"></div>
      <div class="grid-item"><img src="/gallery/IMG_3458.jpg" loading="lazy" alt="Party Photo"></div>
      <div class="grid-item"><img src="/gallery/IMG_3459.jpg" loading="lazy" alt="Party Photo"></div>
      <div class="grid-item"><img src="/gallery/IMG_3460.jpg" loading="lazy" alt="Party Photo"></div>
      <div class="grid-item"><img src="/gallery/IMG_3462.jpg" loading="lazy" alt="Party Photo"></div>
      <div class="grid-item"><img src="/gallery/IMG_8250.JPG" loading="lazy" alt="Party Photo"></div>
      <div class="grid-item"><img src="/gallery/IMG_8252.JPG" loading="lazy" alt="Party Photo"></div>
      <div class="grid-item"><img src="/gallery/IMG_8256.JPG" loading="lazy" alt="Party Photo"></div>
      <div class="grid-item"><img src="/gallery/IMG_8259.JPG" loading="lazy" alt="Party Photo"></div>
      <div class="grid-item"><img src="/gallery/IMG_8260.JPG" loading="lazy" alt="Party Photo"></div>

      <!-- YouTube Shorts Videos -->
      <div class="grid-item video-item">
        <span class="video-tag">Shorts</span>
        <iframe src="https://www.youtube.com/embed/uyjS6cjaZTw" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
      </div>

      <div class="grid-item video-item">
        <span class="video-tag">Shorts</span>
        <iframe src="https://www.youtube.com/embed/-coC8oRQHYs" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
      </div>

      <div class="grid-item video-item">
        <span class="video-tag">Shorts</span>
        <iframe src="https://www.youtube.com/embed/CWMWYf5jHMo" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <!-- Lightbox Modal -->
  <div id="lightbox" class="lightbox modal-hidden">
    <button class="lightbox-close">&times;</button>
    <button class="lightbox-prev">&lsaquo;</button>
    <div class="lightbox-content">
      <img id="lightboxImg" src="" alt="Full View">
    </div>
    <button class="lightbox-next">&rsaquo;</button>
  </div>

  <script type="module" src="/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightboxImg');
      const closeBtn = document.querySelector('.lightbox-close');
      const prevBtn = document.querySelector('.lightbox-prev');
      const nextBtn = document.querySelector('.lightbox-next');
      const galleryImages = Array.from(document.querySelectorAll('.grid-item img'));
      
      let currentIndex = 0;

      const showImage = (index) => {
        if (index < 0) index = galleryImages.length - 1;
        if (index >= galleryImages.length) index = 0;
        currentIndex = index;
        lightboxImg.src = galleryImages[currentIndex].src;
        lightbox.classList.remove('modal-hidden');
        document.body.style.overflow = 'hidden'; // Prevent scrolling
      };

      galleryImages.forEach((img, index) => {
        img.addEventListener('click', () => showImage(index));
      });

      closeBtn.addEventListener('click', () => {
        lightbox.classList.add('modal-hidden');
        document.body.style.overflow = '';
      });

      prevBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        showImage(currentIndex - 1);
      });

      nextBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        showImage(currentIndex + 1);
      });

      lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox || e.target.classList.contains('lightbox-content')) {
          lightbox.classList.add('modal-hidden');
          document.body.style.overflow = '';
        }
      });

      // Keyboard navigation
      document.addEventListener('keydown', (e) => {
        if (lightbox.classList.contains('modal-hidden')) return;
        if (e.key === 'Escape') closeBtn.click();
        if (e.key === 'ArrowLeft') prevBtn.click();
        if (e.key === 'ArrowRight') nextBtn.click();
      });
    });
  </script>
</body>

</html>
